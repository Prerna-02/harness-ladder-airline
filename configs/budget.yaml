# Budget guard inputs (golden rule 6).
# OpenRouter: the live remaining credit is read from GET https://openrouter.ai/api/v1/key before every batch.
# Anthropic: there is no balance endpoint for a normal API key, so set the credit you have loaded here.
#   Spend so far is summed from results/runs.csv (cost_usd of anthropic rows).
anthropic_credit_usd: 10.0   # user-reported balance on 2026-11-21 (console: Settings > Billing)

# Tokens per conversation, used only by --dry-run estimates (no caching assumed, so estimates err high).
# Measured: Haiku 5.5 H0 pilot, 5 core tasks, 2026-11-21 (averages 75.8k / 2.0k agent, 7.9k / 0.3k customer).
# Rounded up ~10%. H1-H3 add prompt text and calls: re-measure at each level's 5-task pilot.
estimate_tokens_per_conversation:
  agent_in: 85000
  agent_out: 2500
  user_in: 9000
  user_out: 400
