# Models for the study. Prices are USD per 1M tokens.
# Sources, checked 2026-11-21:
#   Anthropic: Claude API pricing table (cached 2026-11-03 in the claude-api skill). Haiku 5.5 price holds for
#              prompts up to 100K tokens; above that it is $0.50 / $2.50. Cache read is about 0.1x input.
#   OpenRouter: GET https://openrouter.ai/api/v1/models on 2026-11-21. OpenRouter prices can change; re-check at each batch.
# Cost: OpenRouter calls use the billed usage.cost from each response; these prices are for --dry-run estimates and
# for Anthropic calls (never tau2's agent_cost / user_cost: LiteLLM has no prices for the OpenRouter models).
#
# OpenRouter backend pinning (golden rules 1 and 2): every OpenRouter model is pinned to ONE fp8 endpoint with no
# fallback, so the same weights and precision serve every run. If that endpoint is down, calls fail rather than
# silently switching backend. Endpoint list and prices: GET /api/v1/models/<id>/endpoints (2026-11-21).
#
# Runaway guard (same at every level, so golden rule 1 holds): max_tokens caps one reply, timeout (seconds) caps one
# call. Pilot maxima: agent 2,972 output tokens (Qwen incl. thinking), customer 183. On 2026-11-22 an uncapped customer
# reply ran for minutes (~$0.04 of extra OpenRouter output in one conversation); these caps stop that.

agents:
  haiku-5.5:
    litellm_id: anthropic/claude-haiku-5-5
    provider: anthropic
    price_in: 0.10
    price_cached_in: 0.01
    price_out: 0.50
    # Claude 5.5 models return HTTP 400 on a non-default temperature, so no temperature here.
    # Prompt caching: LiteLLM adds cache_control to the system prompt (policy) on every call.
    llm_args:
      cache_control_injection_points: [{location: message, role: system}]
      max_tokens: 8192
      timeout: 180
  sonnet-5.5:
    litellm_id: anthropic/claude-sonnet-5-5
    provider: anthropic
    price_in: 2.00
    price_cached_in: 0.10
    price_out: 10.00
    llm_args:
      cache_control_injection_points: [{location: message, role: system}]
      max_tokens: 8192
      timeout: 180
  deepseek-v4.1-flash:
    litellm_id: openrouter/deepseek/deepseek-v4.1-flash
    provider: openrouter
    price_in: 0.05          # baidu/fp8 endpoint
    price_cached_in: 0.001
    price_out: 0.199
    llm_args:
      temperature: 0.0
      max_tokens: 8192
      timeout: 180
      extra_body: {provider: {order: [baidu/fp8], allow_fallbacks: false}}
  qwen3.6-35b-a3b:
    litellm_id: openrouter/qwen/qwen3.6-35b-a3b
    provider: openrouter
    price_in: 0.10          # deepinfra/fp8 endpoint (2026-11-22: moved from parasail/fp8, which rate-limited
    price_cached_in: 0.10   # OpenRouter's shared pool; no Qwen study data existed yet)
    price_out: 0.95
    llm_args:
      temperature: 0.0
      max_tokens: 8192
      timeout: 180
      extra_body: {provider: {order: [deepinfra/fp8], allow_fallbacks: false}}

# The simulated customer. Fixed for the whole study (golden rule 2). Must be from a family that is never an agent,
# including in the extension (which adds OpenAI and Gemini agents), so Mistral.
# 2026-11-22: changed from Mistral Small 3.2 (deepinfra/fp8) to Mistral Small 2603 served by Mistral itself, before any
# study run, because 3.2 fell into repetition loops at temperature 0 (2 of 10 pilot conversations). Approved by the user.
user_simulator:
  litellm_id: openrouter/mistralai/mistral-small-2603
  provider: openrouter
  price_in: 0.15            # mistral/zdr endpoint (Mistral's own, zero data retention)
  price_cached_in: 0.15
  price_out: 0.60
  llm_args:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    extra_body: {provider: {order: [mistral/zdr], allow_fallbacks: false}}
